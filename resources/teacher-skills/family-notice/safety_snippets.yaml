topics:
  anti_drowning:
    label: 防溺水
    aliases:
      - 溺水安全
      - 涉水安全
      - 周末防溺水
    default_scene:
      - 周末提醒
      - 节假日前提醒
      - 夏季集中提醒
      - 外出活动前提醒
    reminder_focus:
      parents: "强调看护、行程了解和及时提醒。"
      students: "强调不私自下水、不靠近危险水域、先远离再求助。"
      shared: "强调家校共同提醒，不把冒险当尝试。"
    opening_options:
      - "请家长和同学们共同重视防溺水安全。"
      - "近期天气渐热，请大家继续做好防溺水安全提醒。"
    action_options:
      - "不私自下水，不擅自结伴到危险水域玩耍。"
      - "外出期间远离河边、池塘边、水库边等危险区域。"
      - "发现异常情况先远离、先求助，不盲目施救。"
    closing_options:
      - "请家校共同守护学生安全。"
      - "也请家长继续加强看护和提醒。"
    stage_snippets:
      elementary_lower: "请家长加强看护，提醒孩子不私自到河边、池塘边、水库边玩耍，不在无成人陪同的情况下接近危险水域。"
      elementary_upper: "请提醒孩子不私自下水、不擅自结伴到危险水域玩耍，外出活动时请家长做好看护与行程了解。"
      junior_high: "请提醒学生增强规则意识，不私自下水、不盲目结伴涉水，发现危险情况先远离并及时向成年人求助。"
      senior_high: "请提醒学生做好风险判断，不以冒险行为当作尝试或挑战，外出涉水场景要坚持安全边界并对自身行为负责。"
    elementary_lower: "请家长加强看护，提醒孩子不私自到河边、池塘边、水库边玩耍，不在无成人陪同的情况下接近危险水域。"
    elementary_upper: "请提醒孩子不私自下水、不擅自结伴到危险水域玩耍，外出活动时请家长做好看护与行程了解。"
    junior_high: "请提醒学生增强规则意识，不私自下水、不盲目结伴涉水，发现危险情况先远离并及时向成年人求助。"
    senior_high: "请提醒学生做好风险判断，不以冒险行为当作尝试或挑战，外出涉水场景要坚持安全边界并对自身行为负责。"

  fire_disaster:
    label: 防火防灾
    aliases:
      - 消防安全
      - 防灾减灾
      - 用火用电安全
    default_scene:
      - 节假日前提醒
      - 宿舍或居家提醒
      - 应急演练前后提醒
      - 季节性安全提醒
    reminder_focus:
      parents: "强调居家用火用电安全、陪伴提醒和应急常识。"
      students: "强调不围观、不慌乱、按指引避险。"
      shared: "强调冷静应对和规范操作。"
    opening_options:
      - "请大家继续重视防火防灾安全。"
      - "为保障学习和生活安全，请家长和同学们留意以下提醒。"
    action_options:
      - "注意规范使用电器和充电设备。"
      - "不玩火，不在楼道和疏散通道追逐打闹。"
      - "遇到突发情况保持冷静，按指引有序避险。"
    closing_options:
      - "请把安全习惯落实到日常细节中。"
      - "也请家长帮助学生强化居家安全意识。"
    stage_snippets:
      elementary_lower: "请家长提醒孩子注意用火用电安全，不玩火，不随意触碰危险电器，遇到突发情况先远离并及时求助。"
      elementary_upper: "请提醒孩子规范使用电器，不在楼道追逐打闹，熟悉基本避险方式，发生异常时及时报告老师或家长。"
      junior_high: "请提醒学生遵守消防和疏散规则，不围观、不推挤，遇到突发情况保持冷静，按指引有序避险。"
      senior_high: "请提醒学生增强应急判断，规范使用电器和充电设备，面对火灾或灾害风险时保持冷静并按要求报告和避险。"
    elementary_lower: "请家长提醒孩子注意用火用电安全，不玩火，不随意触碰危险电器，遇到突发情况先远离并及时求助。"
    elementary_upper: "请提醒孩子规范使用电器，不在楼道追逐打闹，熟悉基本避险方式，发生异常时及时报告老师或家长。"
    junior_high: "请提醒学生遵守消防和疏散规则，不围观、不推挤，遇到突发情况保持冷静，按指引有序避险。"
    senior_high: "请提醒学生增强应急判断，规范使用电器和充电设备，面对火灾或灾害风险时保持冷静并按要求报告和避险。"

  traffic_safety:
    label: 交通安全
    aliases:
      - 出行安全
      - 骑行安全
      - 乘车安全
    default_scene:
      - 上下学提醒
      - 节假日出行提醒
      - 研学或活动出发前提醒
      - 恶劣天气前提醒
    reminder_focus:
      parents: "强调接送安全、出行陪护和交通规则示范。"
      students: "强调守法通行、不抢行、不逆行。"
      shared: "强调把安全放在赶时间之前。"
    opening_options:
      - "请继续重视日常交通安全。"
      - "外出增多时，请家长和同学们共同做好交通安全提醒。"
    action_options:
      - "步行时注意交通信号，不追跑打闹。"
      - "骑行时守规慢行，注意观察周边车辆和行人。"
      - "乘车时系好安全带，不乘坐存在明显安全隐患的车辆。"
    closing_options:
      - "请把文明守规落实到每一次出行中。"
      - "也请家长协助学生养成良好的出行习惯。"
    stage_snippets:
      elementary_lower: "请家长加强出行看护，提醒孩子过马路看信号、不追跑打闹，乘车时系好安全带。"
      elementary_upper: "请提醒孩子遵守交通信号，不在路边追逐嬉闹，步行和乘车时都注意观察周边环境。"
      junior_high: "请提醒学生出行守规，不抢行、不逆行，不乘坐存在明显安全隐患的车辆，骑行时注意佩戴防护装备。"
      senior_high: "请提醒学生独立出行时增强风险判断，遵守交通法规，不因赶时间而忽视安全边界，对个人出行安全负责。"
    elementary_lower: "请家长加强出行看护，提醒孩子过马路看信号、不追跑打闹，乘车时系好安全带。"
    elementary_upper: "请提醒孩子遵守交通信号，不在路边追逐嬉闹，步行和乘车时都注意观察周边环境。"
    junior_high: "请提醒学生出行守规，不抢行、不逆行，不乘坐存在明显安全隐患的车辆，骑行时注意佩戴防护装备。"
    senior_high: "请提醒学生独立出行时增强风险判断，遵守交通法规，不因赶时间而忽视安全边界，对个人出行安全负责。"

  food_safety:
    label: 食品安全
    aliases:
      - 饮食安全
      - 校园食品安全
      - 假期饮食提醒
    default_scene:
      - 春秋季卫生提醒
      - 节假日前提醒
      - 校外活动前提醒
      - 常规健康提醒
    reminder_focus:
      parents: "强调卫生把关、来源确认和日常饮食习惯。"
      students: "强调不跟风购买高风险食品，关注包装与保质期。"
      shared: "强调来源清楚、饮食适度、发现不适及时处理。"
    opening_options:
      - "请大家关注近期食品安全与饮食卫生。"
      - "为保障学生健康，请家长和同学们留意以下饮食提醒。"
    action_options:
      - "不购买来源不明或包装信息不清晰的食品。"
      - "注意查看保质期、保存条件和食品外观。"
      - "如出现明显不适，请及时告知家长或老师并就医。"
    closing_options:
      - "请把健康饮食习惯落实到日常生活中。"
      - "也请家长帮助学生把好饮食安全关。"
    stage_snippets:
      elementary_lower: "请家长提醒孩子注意饮食卫生，不购买来源不明食品，少吃生冷和不适宜的零食。"
      elementary_upper: "请提醒孩子关注食品卫生和保质期，不随意购买无明确来源食品，外出就餐时注意饮食清洁。"
      junior_high: "请提醒学生不盲目跟风购买三无食品或高风险食品，注意查看包装、保质期和保存条件。"
      senior_high: "请提醒学生增强食品风险判断，关注来源、保质期和个人身体反应，避免因便利或从众而忽视基本安全。"
    elementary_lower: "请家长提醒孩子注意饮食卫生，不购买来源不明食品，少吃生冷和不适宜的零食。"
    elementary_upper: "请提醒孩子关注食品卫生和保质期，不随意购买无明确来源食品，外出就餐时注意饮食清洁。"
    junior_high: "请提醒学生不盲目跟风购买三无食品或高风险食品，注意查看包装、保质期和保存条件。"
    senior_high: "请提醒学生增强食品风险判断，关注来源、保质期和个人身体反应，避免因便利或从众而忽视基本安全。"

  online_safety:
    label: 网络安全
    aliases:
      - 网络文明
      - 账号安全
      - 上网安全
    default_scene:
      - 节假日居家提醒
      - 手机使用提醒
      - 账号保护提醒
      - 防诈骗关联提醒
    reminder_focus:
      parents: "强调陪伴、时长管理和异常情况关注。"
      students: "强调账号保护、信息辨别和求助意识。"
      shared: "强调不轻信、不乱点、不乱传。"
    opening_options:
      - "请大家继续重视网络安全与文明上网。"
      - "居家和课余上网时，请家长和同学们留意以下提醒。"
    action_options:
      - "不随意点击陌生链接，不轻信陌生信息。"
      - "保护账号密码和个人信息，不随意转发来源不明内容。"
      - "遇到骚扰、诈骗或异常情况时及时截图留存并求助。"
    closing_options:
      - "请共同营造安全、理性的网络环境。"
      - "也请家长关注学生上网内容和使用节奏。"
    stage_snippets:
      elementary_lower: "请家长关注孩子上网内容和时长，提醒孩子不随意点击陌生链接，不轻信陌生人信息。"
      elementary_upper: "请提醒孩子保护个人信息，不随意添加陌生好友，不传播来源不明内容，遇到异常及时告知家长。"
      junior_high: "请提醒学生增强网络规则意识，保护账号和隐私信息，不跟风传播不实信息，遇到骚扰及时求助。"
      senior_high: "请提醒学生理性辨别网络信息，谨慎表达和转发，重视隐私保护与网络责任，不把风险行为当作玩笑。"
    elementary_lower: "请家长关注孩子上网内容和时长，提醒孩子不随意点击陌生链接，不轻信陌生人信息。"
    elementary_upper: "请提醒孩子保护个人信息，不随意添加陌生好友，不传播来源不明内容，遇到异常及时告知家长。"
    junior_high: "请提醒学生增强网络规则意识，保护账号和隐私信息，不跟风传播不实信息，遇到骚扰及时求助。"
    senior_high: "请提醒学生理性辨别网络信息，谨慎表达和转发，重视隐私保护与网络责任，不把风险行为当作玩笑。"

  mental_wellbeing:
    label: 心理健康
    aliases:
      - 情绪健康
      - 心理关怀
      - 压力调适
    default_scene:
      - 考试前后提醒
      - 学期中压力提醒
      - 节假日居家沟通提醒
      - 班级关怀通知
    reminder_focus:
      parents: "强调倾听、陪伴、接纳和及时沟通。"
      students: "强调主动表达、及时求助和压力管理。"
      shared: "强调关注情绪变化，不把困难长期压在心里。"
    opening_options:
      - "请大家一同关注学生近期的情绪与心理状态。"
      - "在学习与生活节奏变化中，也请家长和同学们重视心理健康。"
    action_options:
      - "遇到情绪波动时，先表达、先沟通，不独自硬扛。"
      - "保持规律作息，适度运动，给自己留出调整空间。"
      - "如持续感到明显压力或不适，请及时向家长、老师或专业人员求助。"
    closing_options:
      - "家校保持耐心沟通，比单次提醒更重要。"
      - "请用理解和支持帮助学生稳定成长。"
    stage_snippets:
      elementary_lower: "请家长多关注孩子情绪变化，鼓励孩子表达感受，遇到明显压力或不适时及时沟通和支持。"
      elementary_upper: "请提醒孩子遇到情绪波动时主动表达，不把烦恼长期压在心里，家校保持耐心关注和陪伴。"
      junior_high: "请提醒学生重视情绪和压力管理，遇到困扰及时向家长、老师或可信任的大人寻求支持。"
      senior_high: "请提醒学生关注学业与生活压力变化，遇到持续情绪困扰时及时沟通和求助，把自我调节与主动求助结合起来。"
    elementary_lower: "请家长多关注孩子情绪变化，鼓励孩子表达感受，遇到明显压力或不适时及时沟通和支持。"
    elementary_upper: "请提醒孩子遇到情绪波动时主动表达，不把烦恼长期压在心里，家校保持耐心关注和陪伴。"
    junior_high: "请提醒学生重视情绪和压力管理，遇到困扰及时向家长、老师或可信任的大人寻求支持。"
    senior_high: "请提醒学生关注学业与生活压力变化，遇到持续情绪困扰时及时沟通和求助，把自我调节与主动求助结合起来。"

  campus_activity_safety:
    label: 校园活动安全
    aliases:
      - 活动安全
      - 集体活动安全
      - 外出活动安全
    default_scene:
      - 运动会前提醒
      - 研学前提醒
      - 校内展示活动前提醒
      - 集体外出前提醒
    reminder_focus:
      parents: "强调配合准备、时间衔接和必要提醒。"
      students: "强调服从安排、保持秩序和及时报告。"
      shared: "强调把规则意识落实到活动过程。"
    opening_options:
      - "请大家共同重视本次活动期间的安全与秩序。"
      - "为确保活动顺利开展，请家长和同学们提前做好相关准备。"
    action_options:
      - "活动中听从老师和现场工作人员安排。"
      - "不擅自离队，不追逐打闹，不随意变更行动路线。"
      - "发现身体不适或现场异常时及时报告。"
    closing_options:
      - "请大家以安全、有序的方式参与活动。"
      - "也请家长提前提醒孩子遵守活动要求。"
    stage_snippets:
      elementary_lower: "请提醒孩子活动中听从老师安排，不离队、不打闹，按要求排队和行动。"
      elementary_upper: "请提醒孩子遵守活动秩序，注意个人和同伴安全，不擅自离开集体活动区域。"
      junior_high: "请提醒学生严格遵守活动规则和集合要求，注意现场秩序，发现异常及时报告。"
      senior_high: "请提醒学生在活动中兼顾自主参与与风险判断，遵守组织安排，对个人与集体安全保持责任意识。"
    elementary_lower: "请提醒孩子活动中听从老师安排，不离队、不打闹，按要求排队和行动。"
    elementary_upper: "请提醒孩子遵守活动秩序，注意个人和同伴安全，不擅自离开集体活动区域。"
    junior_high: "请提醒学生严格遵守活动规则和集合要求，注意现场秩序，发现异常及时报告。"
    senior_high: "请提醒学生在活动中兼顾自主参与与风险判断，遵守组织安排，对个人与集体安全保持责任意识。"
